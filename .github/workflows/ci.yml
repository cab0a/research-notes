name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-reproduce:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[comparison,geometry,test]"

      - name: Check out pinned comparison parsers
        run: |
          mkdir -p external
          git init external/steputils
          git -C external/steputils remote add origin https://github.com/mozman/steputils.git
          git -C external/steputils fetch --depth 1 origin 547860b349a36cf24c564d6c87ffd8f60484f6fb
          git -C external/steputils checkout --detach FETCH_HEAD
          git init external/ifcopenshell_step_file_parser
          git -C external/ifcopenshell_step_file_parser remote add origin https://github.com/IfcOpenShell/step-file-parser.git
          git -C external/ifcopenshell_step_file_parser fetch --depth 1 origin 9400d243d880dace57490949d74ab1932ce99a09
          git -C external/ifcopenshell_step_file_parser checkout --detach FETCH_HEAD

      - name: Run README Quick Start
        run: |
          python experiments/run_laplacian_variance.py --output-dir output/quickstart
          test -s output/quickstart/laplacian_variance.png
          test -s output/quickstart/laplacian_variance_summary.csv

      - name: Run unit tests
        run: python -m pytest

      - name: Regenerate reference results
        run: |
          python experiments/run_laplacian_variance.py --output-dir regenerated-results
          python experiments/run_focus_metric_comparison.py --output-dir regenerated-results
          python experiments/run_local_blur_evaluation.py --output-dir regenerated-results
          python experiments/run_window_geometry_evaluation.py --output-dir regenerated-results
          python experiments/run_preprocessing_sensitivity.py --output-dir regenerated-results
          python experiments/run_optical_blur_models.py --output-dir regenerated-results
          python experiments/run_photometric_recompression.py --output-dir regenerated-results
          python experiments/run_jpeg_compression_history.py --output-dir regenerated-results
          python experiments/run_jpeg_codec_portability.py --output-dir regenerated-results
          python experiments/run_cross_platform_codec_contracts.py --output-dir regenerated-results --platform-label linux-x64-reference
          python experiments/run_cross_platform_codec_contracts.py --fixture-dir regenerated-fixtures/jpeg-decoder-contracts --output-dir regenerated-fixture-results --platform-label linux-x64-reference --refresh-fixtures
          python experiments/run_advanced_jpeg_syntax.py --output-dir regenerated-results --platform-label linux-x64-reference
          python experiments/run_advanced_jpeg_syntax.py --fixture-dir regenerated-fixtures/advanced-jpeg-syntax --output-dir regenerated-advanced-fixture-results --platform-label linux-x64-reference --refresh-fixtures
          python experiments/run_color_metadata_interpretation.py --output-dir regenerated-results --platform-label linux-x64-reference
          python experiments/run_color_metadata_interpretation.py --fixture-dir regenerated-fixtures/color-metadata-contracts --output-dir regenerated-metadata-fixture-results --platform-label linux-x64-reference --refresh-fixtures
          python experiments/run_malformed_metadata_recovery.py --output-dir regenerated-results --platform-label linux-x64-reference
          python experiments/run_malformed_metadata_recovery.py --fixture-dir regenerated-fixtures/malformed-jpeg-metadata --output-dir regenerated-recovery-fixture-results --platform-label linux-x64-reference --refresh-fixtures
          python experiments/run_metadata_round_trip.py --output-dir regenerated-results --platform-label linux-x64-reference
          python experiments/run_metadata_generation_drift.py --output-dir regenerated-results --platform-label linux-x64-reference
