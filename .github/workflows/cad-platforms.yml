name: CAD platform contracts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    name: CAD (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: linux-x64, os: ubuntu-24.04}
          - {label: windows-x64, os: windows-2025}
          - {label: macos-x64, os: macos-15-intel}
          - {label: macos-arm64, os: macos-15}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned runtime
        run: python -m pip install -e ".[comparison,geometry,test]"
      - name: Check out pinned comparison parsers
        shell: bash
        run: |
          git clone https://github.com/mozman/steputils.git external/steputils
          git -C external/steputils checkout --detach 547860b349a36cf24c564d6c87ffd8f60484f6fb
          git clone https://github.com/IfcOpenShell/step-file-parser.git external/ifcopenshell_step_file_parser
          git -C external/ifcopenshell_step_file_parser checkout --detach 9400d243d880dace57490949d74ab1932ce99a09
      - name: Check API and native operation behavior
        run: python -m pytest tests/test_step_part21.py tests/test_express_schema.py tests/test_sketch_constraints.py tests/test_parametric_features.py tests/test_deterministic_recompute.py tests/test_assembly_constraints.py tests/test_engineering_analysis.py tests/test_operational_studies.py tests/test_release_studies.py tests/test_cad_web.py tests/test_revision_detection.py tests/test_revision_benchmark.py tests/test_hole_inventory.py tests/test_public_hole_inventory.py tests/test_slot_inventory.py tests/test_unified_hole_inventory.py tests/test_hole_robustness.py tests/test_hole_numerical_stability.py -k "not artifacts_reproduce" -q
      - name: Record actual platform contracts
        run: python -m research_notes.cad_platform --label ${{ matrix.label }} --output-dir cad-observations
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cad-${{ matrix.label }}
          path: cad-observations
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    needs: observe
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v8
        with:
          pattern: cad-*
          path: cad-artifacts
      - name: Require four measured environments with matching contracts
        run: python -m research_notes.cad_platform --aggregate cad-artifacts --output-dir cad-matrix
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cad-matrix
          path: cad-matrix
          retention-days: 30
