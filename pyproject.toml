[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "research-notes"
version = "0.48.0"
description = "Reproducible technical research notes and controlled experiments"
readme = "README.md"
requires-python = ">=3.11"
license = "PolyForm-Noncommercial-1.0.0"
dependencies = [
    "imageio-ffmpeg==0.6.0",
    "matplotlib==3.11.1",
    "numpy==2.4.6",
    "opencv-python-headless==4.13.0.92",
    "Pillow==12.3.0",
]

[project.optional-dependencies]
comparison = [
    "antlr4-python3-runtime==4.9.3",
    "lark-parser==0.12.0",
    "pyparsing==3.2.5",
]
geometry = ["cadquery-ocp==7.9.3.1.1"]
test = ["pytest==9.1.1"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
