[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "research-notes"
version = "1.11.0"
description = "Reproducible technical research notes and controlled experiments"
readme = "README.md"
requires-python = ">=3.11"
license = "PolyForm-Noncommercial-1.0.0"
dependencies = [
    "imageio-ffmpeg==0.6.0",
    "matplotlib==3.11.1",
    "numpy==2.4.6",
    "opencv-python-headless==4.13.0.92",
    "Pillow==12.3.0",
]

[project.optional-dependencies]
comparison = [
    "antlr4-python3-runtime==4.9.3",
    "lark-parser==0.12.0",
    "pyparsing==3.2.5",
]
geometry = ["cadquery-ocp==7.9.3.1.1"]
test = ["pytest==9.1.1"]

[project.scripts]
research-slot-list = "research_notes.slot_inventory:main"
research-hole-list = "research_notes.hole_inventory:main"
research-cad = "research_notes.cad_tool:main"
research-cad-web = "research_notes.cad_web:main"
research-3d = "research_notes.integrated_tool:main"
research-cad-release = "research_notes.release_studies:main"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
research_notes = ["cad_editor/*.html", "cad_editor/*.css", "cad_editor/*.js"]
